---
configuration:
  claude_code_oauth_token:
    name: Claude Code OAuth token
    description: >-
      Optional. A long-lived token from `claude setup-token` (run on any
      machine with a browser). When set it is used instead of the /login
      session saved in the app config folder. Leave empty to log in from
      the terminal with /login.
  config_access:
    name: Home Assistant config folder access
    description: >-
      Let Claude work directly on the Home Assistant configuration files:
      the folder is linked at `/config` and Claude starts there. Off,
      Claude starts in its home folder and is told to make changes through
      `hab` and the Home Assistant API instead of editing YAML files.
  enable_remote_control:
    name: Remote Control
    description: >-
      Start Claude with `--remote-control` so the session also appears as
      "Home Assistant" in the Claude app and claude.ai/code. The session is
      started at app boot, so it is reachable without opening the panel.
      Needs a full /login (a `claude setup-token` token is not enough).
  claude_code_version:
    name: Claude Code version
    description: >-
      Leave empty to install the latest Claude Code release on every start.
      Set a version (e.g. `2.1.300`) to pin it. Falls back to the last
      working build, then to the one bundled in the image, if the download
      fails.
  experimental_code_mode:
    name: Code Mode (experimental)
    description: >-
      Start Claude Code with CLAUDE_CODE_EXPERIMENTAL_CODE_MODE=1. An
      explicit "0" in settings.json's env still turns it off. Has no
      effect while Remote Control is on.
  restart_guard:
    name: Restart guard
    description: >-
      Before Claude restarts Home Assistant (`ha core restart`, the
      Supervisor or homeassistant.restart API), run `ha core check` and
      block the restart if the configuration is invalid.
  statusline:
    name: Statusline
    description: >-
      Show the claudebar statusline under the Claude Code prompt: 5-hour and
      weekly usage limits, context, cost and more. Skipped if settings.json
      already has its own statusLine.
  statusline_theme:
    name: Statusline theme
    description: Colour theme of the statusline.
  statusline_style:
    name: Statusline style
    description: >-
      Look of the statusline. The Nerd Font glyphs that `powerline`, `lean`
      and `rounded` use are bundled with the app, so every style works in
      any browser.
  statusline_segments:
    name: Statusline segments
    description: >-
      Segments to show, in order. `rate-limits` is the 5-hour and weekly
      usage of a Claude subscription.
  statusline_warn:
    name: Warning threshold (%)
    description: Bars turn yellow at this usage.
  statusline_crit:
    name: Critical threshold (%)
    description: Bars turn red at this usage.
  statusline_weekly_show_at:
    name: Show weekly limit from (%)
    description: >-
      The weekly limit appears once its usage reaches this percent. 0 shows
      it always.
