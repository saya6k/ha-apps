---
configuration:
  claude_code_oauth_token:
    name: Claude Code OAuth 토큰
    description: >-
      선택 사항. 브라우저가 있는 아무 기기에서 `claude setup-token`으로
      발급한 장기 토큰. 설정하면 앱 설정 폴더에 저장된 /login 세션 대신
      이 토큰을 사용합니다. 비워 두면 터미널에서 /login으로 로그인합니다.
  config_access:
    name: Home Assistant 설정 폴더 접근
    description: >-
      Claude가 Home Assistant 설정 파일을 직접 다루게 합니다. 설정 폴더를
      `/config`에 연결하고 Claude가 그곳에서 시작합니다. 끄면 Claude는 홈
      폴더에서 시작하고, YAML 파일을 고치는 대신 `hab`과 Home Assistant
      API로 변경하도록 안내받습니다.
  enable_remote_control:
    name: Remote Control
    description: >-
      Claude를 `--remote-control`로 실행해 Claude 앱과 claude.ai/code에서도
      "Home Assistant" 세션으로 이어서 쓸 수 있게 합니다. 앱 시작 시
      세션을 바로 띄우므로 패널을 열지 않아도 접속됩니다. /login 로그인이
      필요합니다(`claude setup-token` 토큰으로는 안 됩니다).
  claude_code_version:
    name: Claude Code 버전
    description: >-
      비워 두면 시작할 때마다 최신 Claude Code를 설치합니다. 버전(예:
      `2.1.300`)을 입력하면 그 버전으로 고정합니다. 다운로드에 실패하면
      마지막으로 동작한 버전, 그다음 이미지에 포함된 버전을 사용합니다.
  experimental_code_mode:
    name: Code Mode (실험적)
    description: >-
      Claude Code를 CLAUDE_CODE_EXPERIMENTAL_CODE_MODE=1로 실행합니다.
      settings.json의 env에 "0"이 있으면 그쪽이 우선해 꺼집니다.
      Remote Control이 켜져 있으면 동작하지 않습니다.
  restart_guard:
    name: 재시작 가드
    description: >-
      Claude가 Home Assistant를 재시작하기 전(`ha core restart`, Supervisor
      또는 homeassistant.restart API)에 `ha core check`를 실행하고, 설정이
      잘못됐으면 재시작을 막습니다.
  statusline:
    name: 상태줄
    description: >-
      Claude Code 입력창 아래에 claudebar 상태줄을 표시합니다. 5시간·주간
      사용량, 컨텍스트, 비용 등을 보여줍니다. settings.json에 이미 다른
      statusLine이 있으면 건드리지 않습니다.
  statusline_theme:
    name: 상태줄 테마
    description: 상태줄 색상 테마.
  statusline_style:
    name: 상태줄 스타일
    description: >-
      상태줄 모양. `powerline`, `lean`, `rounded`가 쓰는 Nerd Font 글리프는
      앱에 포함되어 있어 어떤 브라우저에서도 모든 스타일이 보입니다.
  statusline_segments:
    name: 상태줄 항목
    description: >-
      표시할 항목과 순서. `rate-limits`는 Claude 구독의 5시간·주간
      사용량입니다.
  statusline_warn:
    name: 경고 기준(%)
    description: 사용량이 이 값 이상이면 막대가 노란색이 됩니다.
  statusline_crit:
    name: 위험 기준(%)
    description: 사용량이 이 값 이상이면 막대가 빨간색이 됩니다.
  statusline_weekly_show_at:
    name: 주간 한도 표시 시작(%)
    description: >-
      주간 사용량이 이 값에 도달하면 표시합니다. 0이면 항상 표시합니다.
