---
version: 0.4.3
image: ghcr.io/saya6k/app-claude-code
slug: claude-code
name: Claude Code
description: >-
  Anthropic's Claude Code CLI in a web terminal, served via the ingress
  panel. Login and ~/.claude.json persist in the app config folder.
url: https://github.com/saya6k/ha-app-claude-code
arch:
  - amd64
  - aarch64
init: false
startup: services
ingress: true
panel_icon: mdi:asterisk
panel_title: Claude Code
# homeassistant_api: HA REST API via http://supervisor/core/api — the default
#   `ha` MCP server (/core/api/mcp) and login-url-watcher's notification.
# hassio_api + manager: Supervisor API for Claude — config check, core
#   restart, other apps' info/logs. No docker_api: it requires protection
#   mode off and is effectively host root.
homeassistant_api: true
hassio_api: true
hassio_role: manager
options:
  enable_remote_control: false
  restart_guard: true
  statusline: true
  statusline_theme: tokyo-night
  statusline_style: powerline
  statusline_segments:
    - directory
    - git
    - model
    - context
    - lines
    - rate-limits
    - cost
    - duration
  statusline_warn: 50
  statusline_crit: 80
  statusline_weekly_show_at: 75
schema:
  claude_code_oauth_token: password?
  enable_remote_control: bool
  experimental_code_mode: bool?
  restart_guard: bool
  # Unset: install the latest release on every start. Set: pin that version.
  claude_code_version: match(^[0-9]+\.[0-9]+\.[0-9]+$)?
  # claudebar statusline (written to its config.toml on every start).
  # Names mirror claudebar 2026.8.27's built-in themes/styles/segments.
  statusline: bool
  statusline_theme: list(tokyo-night|ayu-mirage|catppuccin|cobalt2|dracula|everforest-dark|github-dark|gruvbox|kanagawa-wave|moonfly|night-owl|nord|one-dark|rose-pine|solarized-dark|sonokai)
  statusline_style: list(powerline|lean|plain|rounded|minimal|unicode|ascii)
  statusline_segments:
    - list(directory|git|model|context|rate-limits|dev-context|cost|lines|duration|burn|clock)
  statusline_warn: int(1,100)
  statusline_crit: int(1,100)
  statusline_weekly_show_at: int(0,100)
# Downloaded Claude Code builds (~200 MB each) are re-fetched on demand.
backup_exclude:
  - claude-code/**
# homeassistant_config + app_config with explicit paths: the legacy `config`
# type would make the Supervisor ignore app_config entirely, and app_config's
# default target (/config) would collide with the HA config mount.
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: app_config
    read_only: false
    path: /addon_config
