---
configuration:
  model_repo:
    name: 모델 저장소
    description: >-
      임베딩 모델을 내려받을 Hugging Face 저장소. `model_file`과 함께 바꾸고,
      새 모델의 출력 차원이 다르면 `embedding_dimensions`도 같이 바꿔야 한다.
      모델이 바뀌면 저장된 사실을 자동으로 다시 임베딩하므로 기억은 사라지지
      않는다.
  model_file:
    name: 모델 파일
    description: >-
      해당 저장소 안의 GGUF 파일. 기본값(Q8_0, 약 609 MiB)은 거의 무손실이다.
      메모리가 부족할 때만 더 작은 양자화로 내리는 게 좋다 — Q4는 원하는 기억을
      찾아내는 정확도가 눈에 띄게 떨어진다.
  model_sha256:
    name: 모델 체크섬
    description: >-
      선택 항목. 설정하면 내려받은 파일이 이 값과 일치해야 하며, 다르면 애드온이
      정지한다. 비워 두면 검증하지 않고, 실제 체크섬을 로그에 출력하므로 나중에
      여기에 붙여 넣으면 된다.
  embedding_dimensions:
    name: 임베딩 차원
    description: >-
      모델이 만들어내는 벡터의 길이 — 기본 모델은 1024. 모델과 일치해야 하며,
      다르면 검색이 쓸모없는 결과를 낸다. 값을 바꾸면 벡터 저장소를 다시 만들고
      저장된 사실을 전부 다시 임베딩한다.
  threads:
    name: CPU 스레드
    description: >-
      임베딩 사이드카가 사용할 스레드 수. 기기의 코어 수에 맞추면 되고, 코어보다
      많이 줘도 빨라지지 않는다. 임베딩은 사실을 저장하거나 검색할 때만 일어나므로
      상시 부하는 아니다.
  log_level:
    name: 로그 레벨
    description: >-
      MCP 서버와 임베딩 사이드카 양쪽의 로그 상세도. 기본값 `info`면 기동 로그가
      30줄 정도로 유지된다. `debug`나 `trace`로 올리면 llama.cpp의 텐서 단위
      상세까지 나오는데 매우 장황하다.
