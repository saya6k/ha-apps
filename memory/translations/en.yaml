---
configuration:
  embedding_provider:
    name: Embedding provider
    description: >-
      Where embeddings come from. `local` runs a model on this device and
      sends nothing anywhere. `openai`, `huggingface` and `ollama` use that
      service instead — every fact, document and question is then sent to it.
      Changing it re-embeds every stored fact on the next start.
  embedding_url:
    name: Embedding service URL
    description: >-
      For a remote provider. `openai`: the API base including `/v1` (default
      https://api.openai.com/v1; any OpenAI-compatible server works).
      `huggingface`: the full endpoint (default: the Inference Providers
      router for the model; for Text Embeddings Inference, http://host/embed).
      `ollama`: the server, e.g. http://192.168.1.10:11434 (required).
  embedding_api_key:
    name: Embedding service API key
    description: >-
      Sent as a Bearer token to a remote provider. Needed for OpenAI and
      Hugging Face; not for a local Ollama.
  embedding_model:
    name: Embedding service model
    description: >-
      The model to ask a remote provider for, e.g. `text-embedding-3-small`,
      `BAAI/bge-m3` or `embeddinggemma`. Required for a remote provider. Set
      `embedding_dimensions` to its vector size.
  model_repo:
    name: Model repository
    description: >-
      Hugging Face repository the embedding model is downloaded from. Change
      this together with `model_file` — and with `embedding_dimensions` if the
      new model has a different output size. Stored facts are re-embedded
      automatically when the model changes, so nothing is lost.
  model_file:
    name: Model file
    description: >-
      GGUF file within that repository. The default (Q8_0, ~296 MiB) is close
      to lossless. Step down to a smaller quantization only if memory forces
      it — Q4 is measurably less precise at finding the right memory.
  model_sha256:
    name: Model checksum
    description: >-
      Optional. When set, the downloaded file must match it or the add-on
      stops. When left empty the download is not verified, and the actual
      checksum is printed in the log so you can paste it here afterwards.
  embedding_dimensions:
    name: Embedding dimensions
    description: >-
      Vector width the model produces — 768 for the default model. A smaller
      value shortens every vector to that many values (Matryoshka; the default
      model supports 512, 256 and 128), trading some accuracy for size. Only
      for models trained for it. Changing it rebuilds the vector store and
      re-embeds every stored fact.
  query_prefix:
    name: Query prefix
    description: >-
      Text put in front of every search query before it is embedded. The
      default model, EmbeddingGemma 2, expects `task: search result | query: `
      (note the trailing space). Clear it for a model without task prefixes.
      Changing it takes effect immediately and does not re-embed anything.
  document_prefix:
    name: Document prefix
    description: >-
      Text put in front of every fact before it is embedded. The default
      model, EmbeddingGemma 2, expects `title: none | text: `. Clear it for a
      model without task prefixes. Changing it re-embeds every stored fact on
      the next start, just like changing the model.
  threads:
    name: CPU threads
    description: >-
      Threads the embedding sidecar uses. Match your device's core count;
      more threads than cores does not help. Embedding happens only when a
      fact is saved or searched, so this is not a constant load.
  context_size:
    name: Context size
    description: >-
      The longest input the local model takes, in tokens. A larger context
      allows a larger `chunk_size` but costs memory. Only used with the
      `local` provider.
  chunk_size:
    name: Chunk size
    description: >-
      Characters per piece a manual or document is split into for search.
      It must fit the model's context with room to spare — Korean can take
      about one token per character. Changing it re-indexes the documents
      on the next start; facts are not affected.
  log_level:
    name: Log level
    description: >-
      Verbosity for both the MCP server and the embedding sidecar. `info` is
      the default and keeps startup to about thirty lines. Raise to `debug`
      or `trace` to see llama.cpp's per-tensor detail, which is very verbose.
