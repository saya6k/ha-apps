---
configuration:
  idle_timeout_minutes:
    name: Idle timeout (minutes)
    description: >-
      Close a session after this many minutes without a call. Its
      variables and files are discarded.
  max_sessions:
    name: Maximum sessions
    description: >-
      Sessions at once. When full, the least recently used idle session is
      closed to make room.
  memory_limit_mb:
    name: Memory limit (MB)
    description: >-
      Address-space limit per sandbox process (minimum 1024). It counts
      reserved memory, so real use is lower. Code that goes beyond it gets a
      MemoryError (Python) or RangeError (JavaScript).
  network_allowlist:
    name: Network allowlist
    description: >-
      Hosts sandboxed code may reach over HTTPS, as host or host:port
      (*.domain for subdomains), e.g. pypi.org and *.pythonhosted.org for
      pip install. * allows any public host on port 443 (*:port for others).
      Empty = no network at all.
  max_file_mb:
    name: Maximum file size (MB)
    description: >-
      Largest file for share.import and share.export.
  export_dir:
    name: Export directory
    description: >-
      Where share.export puts files, one subfolder per session. Must be
      under /share.
  audit_retention_days:
    name: Audit log retention (days)
    description: >-
      Days of audit log (/data/audit) to keep.
  hab_allow:
    name: hab commands that may change Home Assistant
    description: >-
      For administrators' ha.admin.hab(): commands as typed, * for any rest,
      e.g. "automation update *". Reading commands always run. Empty =
      nothing is changed.
  hab_deny:
    name: hab commands to refuse
    description: >-
      Refused even when hab_allow matches, e.g. "automation update alarm_*".
  skill_workflow:
    name: Propose skills from finished sessions
    description: >-
      When a user's session ends, send the code that ran to an AI Task
      entity, which may propose a reusable skill. Proposals wait for an
      administrator's approval in the panel. Off: nothing is sent.
  skill_ai_task_entity:
    name: AI Task entity for skill review
    description: >-
      e.g. ai_task.claude_ai_task. Empty = Home Assistant's preferred AI Task
      entity.
  plugins:
    name: Plugins (MCP servers)
    description: >-
      MCP servers Home Assistant already connects to (Model Context Protocol
      integration) that scripts may call as plugins.<server>.<tool>(). name
      is the integration entry's title; access is all (every Home Assistant
      user) or admin (administrators only).
network:
  8099/tcp: >-
    MCP endpoint (streamable HTTP at /mcp). Leave unset — Home Assistant
    reaches it over the internal network, and only Home Assistant holds the
    token it requires.
