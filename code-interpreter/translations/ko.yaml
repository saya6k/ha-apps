---
configuration:
  idle_timeout_minutes:
    name: 유휴 종료 시간(분)
    description: >-
      호출이 없는 상태로 이 시간이 지나면 세션을 닫습니다. 그 세션의 변수와
      파일은 사라집니다.
  max_sessions:
    name: 최대 세션 수
    description: >-
      동시에 유지할 세션 수. 가득 차면 가장 오래 쓰지 않은 세션을 닫고 새
      세션을 엽니다.
  memory_limit_mb:
    name: 메모리 한도(MB)
    description: >-
      샌드박스마다 적용되는 주소 공간 한도(최소 768). 예약된 메모리까지
      세므로 실제 사용량은 이보다 적습니다. 넘으면 MemoryError가 납니다.
  network_allowlist:
    name: 네트워크 허용 목록
    description: >-
      샌드박스 코드가 HTTPS로 접속할 수 있는 호스트(host 또는 host:port,
      하위 도메인은 *.domain). pip install에는 pypi.org와
      *.pythonhosted.org를 넣으세요. 비우면 네트워크를 전혀 쓸 수 없습니다.
  max_file_mb:
    name: 최대 파일 크기(MB)
    description: >-
      /share에서 가져오기, /share로 내보내기, write_file에 허용하는 최대
      파일 크기.
  export_dir:
    name: 내보내기 폴더
    description: >-
      export_to_share가 파일을 놓는 곳(세션마다 하위 폴더). /share 아래여야
      합니다.
  audit_retention_days:
    name: 감사 로그 보관 기간(일)
    description: >-
      감사 로그(/data/audit)를 보관할 일수.
network:
  8099/tcp: >-
    MCP 엔드포인트(/mcp, streamable HTTP). 비워 두세요 — Home Assistant는
    내부 네트워크로 접속합니다. 외부 MCP 클라이언트가 필요할 때만 매핑하세요.
