---
name: Code Interpreter
version: 0.11.0
image: ghcr.io/saya6k/app-code-interpreter
slug: code-interpreter
description: >-
  Sandboxed JavaScript (and Python) for Assist conversation agents over MCP:
  one script per call reads and controls Home Assistant, analyzes data and
  exchanges files via /share. Bubblewrap sandbox, no network by default,
  JSONL audit log.
url: https://github.com/saya6k/ha-app-code-interpreter
arch:
  - aarch64
  - amd64
init: false
startup: services
ingress: true
ingress_port: 8098
panel_icon: mdi:code-tags
panel_title: Code Interpreter
# /core/api/mcp/<api> and the websocket API through the Supervisor proxy:
# the app calls Home Assistant's MCP Server for the cells (ha.*).
# The MCP endpoint requires the discovery token (Home Assistant core #190779).
homeassistant: 2026.12.0b0
homeassistant_api: true
# hassio.app_stdin: skill requests from automations and scripts (DOCS: Skills).
stdin: true
map:
  - share:rw
discovery:
  - mcp
ports:
  8099/tcp: null
ports_description:
  8099/tcp: >-
    MCP endpoint (streamable HTTP at /mcp). Leave unset — Home Assistant
    reaches it over the internal network, and only Home Assistant holds the
    token it requires.
options:
  idle_timeout_minutes: 20
  max_sessions: 3
  memory_limit_mb: 2048
  network_allowlist: []
  max_file_mb: 20
  export_dir: /share/code-interpreter
  audit_retention_days: 30
  hab_allow: []
  hab_deny: []
  skill_workflow: false
  skill_ai_task_entity: ""
  plugins: []
schema:
  idle_timeout_minutes: int(1,1440)
  max_sessions: int(1,10)
  memory_limit_mb: int(1024,8192)
  network_allowlist:
    - str?
  max_file_mb: int(1,500)
  export_dir: str
  audit_retention_days: int(1,365)
  hab_allow:
    - str?
  hab_deny:
    - str?
  skill_workflow: bool
  skill_ai_task_entity: str?
  plugins:
    - name: str
      access: list(all|admin)
      api: str?
